﻿﻿﻿﻿<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sales Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:clip;}
body{font-family:'Segoe UI',sans-serif;background:#060e18;color:#e2e8f0;min-height:100vh;max-width:100vw;background-image:radial-gradient(ellipse at 15% 60%,rgba(20,184,166,0.1) 0%,transparent 50%),radial-gradient(ellipse at 85% 10%,rgba(139,92,246,0.09) 0%,transparent 45%),radial-gradient(ellipse at 50% 95%,rgba(13,148,136,0.06) 0%,transparent 40%);}
button,input,select{font-family:inherit;}
@property --borderAngle{syntax:'<angle>';initial-value:0deg;inherits:false;}
@keyframes borderSpin{to{--borderAngle:360deg;}}
@keyframes headerSweep{0%{left:-100%;}100%{left:200%;}}
@keyframes headerShimmer{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.header{background:linear-gradient(135deg,#060d18,#08202e,#092535,#061e2a,#0a2535);background-size:400% 400%;animation:headerShimmer 10s ease infinite;padding:14px 24px 10px;border-bottom:1px solid rgba(20,184,166,0.2);position:relative;overflow:hidden;text-align:center;}
.header::before{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(20,184,166,0.07),rgba(94,234,212,0.05),transparent);animation:headerSweep 7s ease-in-out infinite;}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(13,148,136,0.5),rgba(94,234,212,0.6),rgba(13,148,136,0.5),transparent);}
.header h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,#5eead4 0%,#2dd4bf 40%,#67e8f9 70%,#a5f3fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative;letter-spacing:-0.5px;margin-bottom:10px;}
.header p{font-size:13px;color:#e0f7fa;font-weight:700;margin-top:0;position:relative;letter-spacing:0;font-style:italic;}
.header-sub2{font-size:11px;color:#7dd3fc;font-weight:500;margin-top:6px;position:relative;letter-spacing:0;font-style:normal!important;}
.tabs{display:flex;justify-content:center;background:rgba(10,15,28,0.9);border-bottom:1px solid rgba(51,65,85,0.4);overflow-x:hidden;backdrop-filter:blur(8px);}
.tab-btn{position:relative;padding:12px 16px;border:none;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;background:transparent;color:#4b6080;border-bottom:2px solid transparent;transition:color 0.2s,border-color 0.2s,text-shadow 0.2s;}
.stat-row1{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px;}
.stat-row2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.tab-btn.active{background:transparent;border-bottom:none;animation:tabBreath 2.5s ease-in-out infinite;}
.tab-btn.active::before{content:'';position:absolute;inset:-1px;padding:1.5px;background:conic-gradient(from var(--borderAngle),#2dd4bf 0deg,transparent 50deg,transparent 155deg,#a78bfa 180deg,transparent 230deg,transparent 340deg,#2dd4bf 360deg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;border-radius:4px 4px 0 0;animation:borderSpin 2s linear infinite;pointer-events:none;}
.tab-btn:hover:not(.active){color:#7ab8b0;border-bottom-color:rgba(20,184,166,0.3);}
.content{padding:20px 24px;max-width:960px;margin:0 auto;}
.card{background:rgba(8,24,30,0.8);backdrop-filter:blur(12px);border-radius:16px;padding:16px;border:1px solid rgba(20,184,166,0.12);margin-bottom:12px;box-shadow:0 4px 24px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.03);}
.card-dark{background:rgba(8,15,30,0.85);backdrop-filter:blur(8px);border-radius:16px;padding:16px;border:1px solid rgba(51,65,85,0.35);margin-bottom:12px;}
.lbl{font-size:13px;color:#8ab0c8;display:block;margin-bottom:4px;}
.inp{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(51,65,85,0.5);background:rgba(12,24,55,0.9);color:#f1f5f9;font-size:14px;transition:all 0.2s;}
.inp:hover{background:rgba(15,32,72,0.92);border-color:rgba(96,165,250,0.3);}
.inp:focus{outline:none;border-color:rgba(96,165,250,0.65);background:rgba(15,32,72,0.95);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.sel{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(51,65,85,0.5);background:rgba(12,24,55,0.9);color:#f1f5f9;font-size:14px;transition:all 0.2s;}
.sel:hover{background:rgba(15,32,72,0.92);border-color:rgba(96,165,250,0.3);}
.sel:focus{outline:none;border-color:rgba(96,165,250,0.65);background:rgba(15,32,72,0.95);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
@keyframes flashRed{0%{border-color:#ef4444;background:#2d0a0a;}50%{border-color:#f87171;background:#450f0f;}100%{border-color:#ef4444;background:#2d0a0a;}}
.inp.field-error{border-color:#ef4444!important;background:#2d0a0a!important;animation:flashRed 0.4s ease 3;}
.sel.field-error{border-color:#ef4444!important;background:#2d0a0a!important;animation:flashRed 0.4s ease 3;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.btn-pri{padding:12px;border-radius:10px;border:none;background:linear-gradient(90deg,#f59e0b 50%,#7c3aed 50%);background-size:210%;background-position:right center;color:#fff;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:background-position 0.45s ease,box-shadow 0.22s,transform 0.22s;box-shadow:0 2px 16px rgba(124,58,237,0.3);}
.btn-pri:hover{background-position:left center;box-shadow:0 0 28px rgba(245,158,11,0.5),0 4px 16px rgba(217,119,6,0.25);transform:translateY(-2px);}
.btn-pri:active{transform:translateY(0);box-shadow:0 0 14px rgba(245,158,11,0.3);}
.btn-sm{padding:5px 14px;border-radius:7px;border:1px solid rgba(13,148,136,0.6);background:rgba(15,80,72,0.7);color:#5eead4;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-sm:hover{background:rgba(13,148,136,0.8);border-color:rgba(45,212,191,0.7);box-shadow:0 0 12px rgba(20,184,166,0.25);}
.btn-del{background:rgba(127,29,29,0.7);border:1px solid rgba(239,68,68,0.2);border-radius:7px;padding:4px 10px;color:#fca5a5;font-size:12px;cursor:pointer;transition:all 0.2s;}
.btn-del:hover{background:rgba(153,27,27,0.9);box-shadow:0 0 10px rgba(239,68,68,0.2);}
.btn-rider{padding:4px 12px;border-radius:7px;border:1px solid rgba(79,70,229,0.5);background:rgba(30,27,75,0.8);color:#a5b4fc;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-rider:hover{background:rgba(49,46,129,0.9);box-shadow:0 0 10px rgba(99,102,241,0.2);}
.pol-block{background:rgba(5,18,18,0.9);border-radius:14px;padding:16px;border:1px solid rgba(13,148,136,0.25);margin-bottom:12px;box-shadow:0 0 24px rgba(13,148,136,0.07),inset 0 1px 0 rgba(94,234,212,0.04);}
.rider-block{background:rgba(4,14,14,0.9);border-radius:10px;padding:12px;border:1px solid rgba(13,148,136,0.2);margin-bottom:8px;box-shadow:0 0 14px rgba(13,148,136,0.05);}
.prev-box{margin-top:12px;background:rgba(5,25,25,0.8);backdrop-filter:blur(8px);border-radius:12px;padding:12px;border:1px solid rgba(13,148,136,0.28);box-shadow:0 0 20px rgba(13,148,136,0.08);}
.mc{text-align:center;background:rgba(8,15,30,0.8);border-radius:8px;padding:6px 2px;border:1px solid rgba(51,65,85,0.3);}
.mc .ml{font-size:10px;color:#4b6080;}
.mc .mv{font-size:13px;font-weight:700;margin-top:1px;}
@keyframes progPulse{0%,100%{box-shadow:0 0 6px rgba(20,184,166,0.3);}50%{box-shadow:0 0 14px rgba(20,184,166,0.55);}}
@keyframes tabBreath{0%,100%{color:#2dd4bf;text-shadow:0 0 12px rgba(45,212,191,0.5);}50%{color:#a5f3fc;text-shadow:0 0 20px rgba(165,243,252,0.95),0 0 38px rgba(45,212,191,0.35);}}
@keyframes shineSweep{0%,15%{left:-65%;}80%,100%{left:115%;}}
@keyframes breathBright{0%,100%{filter:brightness(0.55);}50%{filter:brightness(1.4);}}
.pb-candy{background:linear-gradient(90deg,#b45309,#d97706,#f59e0b,#fbbf24)!important;}
.pb-shimmer{background:linear-gradient(90deg,#059669,#34d399,#6ee7b7)!important;}
.pb-aurora{background:linear-gradient(90deg,#6d28d9,#a78bfa,#c4b5fd)!important;}
.pb-river{background:linear-gradient(90deg,#ea580c,#fb923c,#fed7aa)!important;}
.mdrt-pbar{height:100%;border-radius:8px;transition:width 0.8s ease;}
.mdrt-pbar-mdrt{background:linear-gradient(90deg,#b45309,#f59e0b,#fcd34d)!important;}
.mdrt-pbar-cot{background:#0ea5e9!important;}
.mdrt-pbar-tot{background:linear-gradient(90deg,#5b21b6,#a78bfa,#ddd6fe)!important;}
.prog-wrap{background:rgba(8,15,30,0.8);border-radius:8px;height:14px;overflow:hidden;margin:6px 0;border:1px solid rgba(51,65,85,0.2);}
.prog-bar{height:100%;border-radius:8px;transition:width 0.6s cubic-bezier(0.4,0,0.2,1);background:linear-gradient(90deg,#0f766e,#0d9488,#2dd4bf);}
.prog-bar.pb-candy{animation:breathBright 2.6s ease-in-out infinite;}
.prog-bar.pb-shimmer{position:relative;overflow:hidden;}
.prog-bar.pb-shimmer::after{content:'';position:absolute;top:0;bottom:0;left:-65%;width:55%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.55),transparent);animation:shineSweep 2.5s linear infinite;pointer-events:none;}
.prog-bar.pb-river{position:relative;overflow:hidden;}
.prog-bar.pb-river::after{content:'';position:absolute;top:0;bottom:0;left:-65%;width:55%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.55),transparent);animation:shineSweep 2.8s linear infinite;pointer-events:none;}
.prog-bar.pb-aurora{animation:breathBright 3s ease-in-out infinite;}
.mdrt-pbar.mdrt-pbar-mdrt{position:relative;overflow:hidden;}
.mdrt-pbar.mdrt-pbar-mdrt::after{content:'';position:absolute;top:0;bottom:0;left:-65%;width:55%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);animation:shineSweep 2.6s linear infinite;pointer-events:none;}
.mdrt-pbar.mdrt-pbar-cot{animation:breathBright 2.2s ease-in-out infinite;}
.mdrt-pbar.mdrt-pbar-tot{position:relative;overflow:hidden;}
.mdrt-pbar.mdrt-pbar-tot::after{content:'';position:absolute;top:0;bottom:0;left:-65%;width:55%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.45),transparent);animation:shineSweep 3s linear infinite;pointer-events:none;}
.kpi{font-size:18px;font-weight:800;margin-top:4px;background:linear-gradient(135deg,#34d399,#2dd4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.pay-card{background:linear-gradient(135deg,rgba(5,28,26,0.9),rgba(4,20,20,0.95));backdrop-filter:blur(12px);border-radius:14px;padding:18px;border:1px solid rgba(13,148,136,0.35);margin-bottom:16px;text-align:center;box-shadow:0 4px 28px rgba(13,148,136,0.1);}
.dash-stat-card{background:rgba(6,20,20,0.8);backdrop-filter:blur(12px);border-radius:14px;padding:16px;border:1px solid rgba(13,148,136,0.15);margin-bottom:12px;text-align:center;transition:border-color 0.22s,box-shadow 0.22s;}
.dash-stat-card:hover{border-color:rgba(20,184,166,0.3);box-shadow:0 0 22px rgba(20,184,166,0.07);}
.camp-hdr{background:linear-gradient(135deg,#0d1f3c,#0f2942);padding:16px 20px;border-bottom:1px solid rgba(30,64,175,0.3);}
.camp-card{background:rgba(22,32,52,0.7);border-radius:16px;border:1px solid rgba(51,65,85,0.35);overflow:hidden;margin-bottom:20px;}
.yr-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid #0d9488;background:linear-gradient(135deg,#0f766e,#134e4a);color:#5eead4;font-size:13px;font-weight:700;cursor:pointer;}
.yr-dd{position:absolute;top:calc(100% + 6px);left:0;z-index:999;background:#1e293b;border:1px solid #0d9488;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.5);min-width:110px;max-height:240px;overflow-y:auto;}
.yr-opt{display:block;width:100%;padding:9px 16px;border:none;cursor:pointer;font-size:13px;text-align:left;font-family:inherit;}
.q-btn{flex:1;min-width:60px;padding:8px 0;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;border:1px solid rgba(51,65,85,0.5);background:rgba(30,41,59,0.7);color:#4b6080;transition:all 0.2s;position:relative;}
.q-btn.active{background:rgba(251,191,36,0.08);color:#fbbf24;border-color:transparent;box-shadow:0 0 12px rgba(251,191,36,0.1);}
.q-btn.active::before{content:'';position:absolute;inset:-1px;padding:1.5px;background:conic-gradient(from var(--borderAngle),#fbbf24 0deg,transparent 50deg,transparent 155deg,#f472b6 180deg,transparent 230deg,transparent 340deg,#fbbf24 360deg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;border-radius:8px;animation:borderSpin 2.8s linear infinite;pointer-events:none;}
.camp-tab-btn{position:relative;}
.camp-tab-active::before{content:'';position:absolute;inset:-2px;padding:2px;background:conic-gradient(from var(--borderAngle),#f97316 0deg,transparent 55deg,transparent 150deg,#10b981 180deg,transparent 235deg,transparent 340deg,#f97316 360deg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;border-radius:12px;animation:borderSpin 2.5s linear infinite;pointer-events:none;}
.hist-item{background:rgba(6,20,20,0.8);backdrop-filter:blur(8px);border-radius:14px;padding:16px;border:1px solid rgba(13,148,136,0.15);margin-bottom:12px;transition:border-color 0.22s,box-shadow 0.22s;}
.hist-item:hover{border-color:rgba(20,184,166,0.25);box-shadow:0 0 18px rgba(20,184,166,0.06);}
.pol-row{background:rgba(5,12,24,0.8);border-radius:8px;padding:10px;border:1px solid rgba(30,58,95,0.4);margin-bottom:6px;}
.badge{background:rgba(15,41,66,0.9);border-radius:4px;padding:2px 8px;font-size:11px;color:#60a5fa;border:1px solid rgba(59,130,246,0.15);}
.badge-fwd{background:rgba(15,42,30,0.9);border-radius:4px;padding:2px 8px;font-size:11px;color:#34d399;border:1px solid rgba(52,211,153,0.15);}
.t-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.cal-wrap{position:relative;}
.cal-row{display:flex;gap:6px;}
.cal-ico{padding:9px 13px;border-radius:9px;border:1px solid rgba(13,148,136,0.4);background:rgba(4,18,18,0.85);cursor:pointer;font-size:16px;color:#2dd4bf;transition:all 0.18s;}
.cal-ico:hover{background:rgba(5,30,28,0.9);border-color:rgba(45,212,191,0.5);box-shadow:0 0 10px rgba(20,184,166,0.2);}
.cal-ico.open{background:rgba(13,148,136,0.8);color:#fff;box-shadow:0 0 14px rgba(20,184,166,0.35);}
.cal-pop{position:absolute;z-index:999;top:calc(100% + 6px);left:0;background:rgba(4,18,18,0.97);backdrop-filter:blur(16px);border:1px solid rgba(20,184,166,0.2);border-radius:14px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,0.7);min-width:265px;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cal-nb{background:rgba(51,65,85,0.6);border:none;border-radius:6px;padding:4px 12px;color:#e2e8f0;cursor:pointer;font-size:15px;transition:background 0.15s;}
.cal-nb:hover{background:rgba(51,65,85,0.9);}
.cal-ysel{background:rgba(8,15,30,0.8);border:1px solid rgba(51,65,85,0.4);border-radius:6px;padding:3px 6px;color:#60a5fa;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.cal-dh{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
.cal-dh span{text-align:center;font-size:11px;color:#4b6080;font-weight:600;padding:2px 0;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day{padding:6px 2px;border:none;border-radius:6px;cursor:pointer;font-size:12px;background:transparent;color:#e2e8f0;font-family:inherit;transition:background 0.12s;}
.cal-day:hover:not(.empty){background:rgba(59,130,246,0.15);}
.cal-day.empty{cursor:default;color:transparent;}
.cal-day.today{color:#2dd4bf;outline:1px solid rgba(13,148,136,0.4);}
.cal-day.selected{background:rgba(13,148,136,0.85)!important;color:#fff!important;font-weight:700;box-shadow:0 0 8px rgba(20,184,166,0.35);}
.cal-tod{margin-top:8px;width:100%;padding:7px;border-radius:7px;border:1px solid rgba(13,148,136,0.35);background:rgba(4,18,18,0.85);color:#2dd4bf;font-size:12px;cursor:pointer;font-weight:600;font-family:inherit;transition:all 0.2s;}
.cal-tod:hover{border-color:rgba(45,212,191,0.5);box-shadow:0 0 10px rgba(20,184,166,0.18);}
.srch-wrap{position:relative;}
.srch-inp{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(20,184,166,0.4);background:rgba(22,38,46,0.9);color:#f1f5f9;font-size:14px;outline:none;transition:all 0.2s;}
.srch-inp:hover{background:rgba(18,42,44,0.92);}
.srch-inp:focus{border-color:rgba(45,212,191,0.7);box-shadow:0 0 0 3px rgba(20,184,166,0.1);}
.srch-list{position:absolute;z-index:9999;top:calc(100% + 4px);left:0;right:0;background:rgba(4,16,16,0.97);backdrop-filter:blur(16px);border:1px solid rgba(20,184,166,0.2);border-radius:12px;max-height:260px;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.75);}
.srch-cat{padding:6px 12px;font-size:10px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;cursor:default;border-left:4px solid;}
.cat-trad{background:rgba(30,58,138,0.4);color:#93c5fd;border-color:#3b82f6;}
.cat-ilp{background:rgba(76,29,149,0.4);color:#d8b4fe;border-color:#a855f7;}
.cat-health{background:rgba(6,78,59,0.4);color:#6ee7b7;border-color:#10b981;}
.cat-top{background:rgba(28,22,0,0.6);color:#fbbf24;border-color:#f59e0b;}
.srch-item{padding:8px 16px;font-size:13px;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all 0.15s;}
.srch-item:hover{background:rgba(15,41,66,0.8);border-left-color:#3b82f6;color:#e2e8f0;}
.srch-sel{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(13,148,136,0.3);background:rgba(22,38,46,0.9);color:#f1f5f9;font-size:13px;cursor:pointer;text-align:left;transition:all 0.2s;}
.srch-sel:hover{border-color:rgba(45,212,191,0.45);background:rgba(18,42,44,0.92);box-shadow:0 0 0 3px rgba(20,184,166,0.07);}
.srch-ph{color:#4b6080;}
.val-err{color:#f87171;font-size:12px;font-weight:600;margin-top:8px;margin-bottom:8px;display:none;text-align:center;}
.val-err.show{display:block;}
.fwd-card{background:linear-gradient(135deg,rgba(10,31,20,0.85),rgba(13,43,26,0.9),rgba(15,51,32,0.85));border-radius:14px;padding:16px;border:1px solid rgba(22,101,52,0.4);margin-bottom:12px;box-shadow:0 4px 20px rgba(16,185,129,0.05);}
.fwd-sale-item{background:linear-gradient(135deg,rgba(7,21,16,0.9),rgba(10,31,20,0.9));border-radius:10px;padding:14px;border:1px solid rgba(22,101,52,0.35);margin-bottom:10px;}
.bending-badge{display:inline-block;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;}
.bend-base{background:rgba(28,42,28,0.8);color:#86efac;border:1px solid rgba(22,101,52,0.5);}
.bend-mid{background:rgba(28,37,22,0.8);color:#fde68a;border:1px solid rgba(217,119,6,0.5);}
.bend-high{background:rgba(28,26,16,0.8);color:#fca5a5;border:1px solid rgba(220,38,38,0.5);}
/* Payout timeline */
.timeline-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px;}

.month-card{background:rgba(5,12,20,0.8);border-radius:10px;padding:10px 8px;border:1px solid rgba(22,101,52,0.3);text-align:center;cursor:default;transition:transform 0.15s,box-shadow 0.15s;}

function getYearTotals(yr){
  const ys=sales.filter(s=>s.date.startsWith(String(yr)));
  const rys=renewalSales.filter(s=>s.date.startsWith(String(yr)));
  const gys=giSales.filter(s=>s.date.startsWith(String(yr)));
  let incomeComm=0,renewalComm=0,giComm=0,totalBonus=0;
  Object.keys(QS).forEach(q=>{
    const qs=ys.filter(s=>s.quarter===q);
    const rqs=rys.filter(s=>s.quarter===q);
    const gqs=gys.filter(s=>s.quarter===q);
    const qIncome=qs.reduce((a,s)=>a+s.totalComm,0);
    const qRenewal=rqs.reduce((a,s)=>a+s.totalComm,0);
    const qGI=gqs.reduce((a,s)=>a+(s.commission||s.totalComm||0),0);
    const tm=qIncome+qRenewal+qGI;
    const tc=qs.reduce((a,s)=>a+s.totalCredit,0);
    const tier=getTier(tc);
    const eb=tm>=3000?tm*0.25:0;
    const qb=tm*tier.bonus/100;
    incomeComm+=qIncome;renewalComm+=qRenewal;giComm+=qGI;totalBonus+=eb+qb;
  });
  const totalComm=incomeComm+renewalComm+giComm;
  return{incomeComm,renewalComm,giComm,totalComm,totalBonus,grand:totalComm+totalBonus};
}

function getTopProducts(){
  const freq={};
  sales.forEach(s=>{if(s.policies)s.policies.forEach(p=>{if(p.product)freq[p.product]=(freq[p.product]||0)+1;});});
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>e[0]);
}

function renderAll(){renderTabs();renderPage();}

function renderTabs(){
  const TABS=[["log","➕ Log Sale"],["dashboard","📈 Dashboard"],["history","📋 All Sales"],["fwd","🏢 3rd Party"],["campaigns","🎯 Campaigns"],["mdrt","🏆 MDRT / COT / TOT"],["pipeline","🚀 Pipeline"]];
  document.getElementById("tabBar").innerHTML=TABS.map(([k,v])=>`<button class="tab-btn${tab===k?" active":""}" onclick="setTab('${k}')">${v}</button>`).join("");
}

function renderPage(){
  const el=document.getElementById("app");
  if(tab==="log"){if(!document.getElementById("logShell"))el.innerHTML="<div id='logShell'></div>";renderLog();}
  else if(tab==="dashboard")el.innerHTML=renderDash();
  else if(tab==="history")el.innerHTML=renderHist();
  else if(tab==="fwd")el.innerHTML=renderFWD();
  else if(tab==="campaigns")el.innerHTML=renderCampaigns();
  else if(tab==="mdrt")el.innerHTML=renderMDRT();
  else if(tab==="pipeline")el.innerHTML=renderPipeline();
  attachAll();
}

function buildCal(prefix=""){
  const dateVal=prefix?fwdForm.date:fDate;
  const open=prefix?fwdForm.calOpen:calOpen;
  const cY=prefix?fwdForm.calY:calY;
  const cM=prefix?fwdForm.calM:calM;
  const sd=dateVal?new Date(dateVal+"T00:00:00"):null;
  const disp=sd?sd.toLocaleDateString("en-SG",{day:"2-digit",month:"short",year:"numeric"}):"";
  const id=prefix?"fwdDateInp":"dateInp";
  const icoId=prefix?"fwdCalIco":"calIco";
  const wrapId=prefix?"fwdCalWrap":"calWrap";
  return "<div class='cal-wrap' id='"+wrapId+"'>"
  +"<div class='cal-row'><input class='inp' id='"+id+"' type='text' placeholder='YYYY-MM-DD' value='"+dateVal+"' style='flex:1;'/>"
  +"<button class='cal-ico"+(open?" open":"")+"' id='"+icoId+"'>📅</button></div>"
  +(disp?"<div style='font-size:11px;color:#64748b;margin-top:3px;'>"+disp+"</div>":"")
  +(open?buildCalPop(prefix):"")+"</div>";
}

function buildCalPop(prefix=""){
  const cY=prefix?fwdForm.calY:calY;
  const cM=prefix?fwdForm.calM:calM;
  const dateVal=prefix?fwdForm.date:fDate;
  const today=new Date();
  const first=new Date(cY,cM,1).getDay(),dim=new Date(cY,cM+1,0).getDate();
  const sd=dateVal?new Date(dateVal+"T00:00:00"):null;
  let cells="";
  for(let i=0;i<first;i++)cells+="<button class='cal-day empty' disabled></button>";
  for(let d=1;d<=dim;d++){
    const isSel=sd&&sd.getFullYear()===cY&&sd.getMonth()===cM&&sd.getDate()===d;
    const isTod=today.getFullYear()===cY&&today.getMonth()===cM&&today.getDate()===d;
    const fn=prefix?`fwdPickDay(${d})`:`pickDay(${d})`;
    cells+="<button class='cal-day"+(isSel?" selected":isTod?" today":"")+"' onclick='"+fn+"'>"+d+"</button>";
  }
  const navFn=prefix?"fwdNavM":"navM",jumpFn=prefix?"fwdJumpY":"jumpY",todFn=prefix?"fwdPickToday":"pickToday";
  const yOpts=yearList().map(y=>"<option value='"+y+"'"+(y===cY?" selected":"")+">"+y+"</option>").join("");
  return "<div class='cal-pop'><div class='cal-nav'><button class='cal-nb' onclick='"+navFn+"(-1)'>&#8249;</button>"
  +"<div style='display:flex;align-items:center;gap:6px;'><span style='font-weight:700;font-size:13px;color:#60a5fa;'>"+MTHS[cM]+"</span>"
  +"<select class='cal-ysel' onchange='"+jumpFn+"(parseInt(this.value))'>"+yOpts+"</select></div>"
  +"<button class='cal-nb' onclick='"+navFn+"(1)'>&#8250;</button></div>"
  +"<div class='cal-dh'>"+["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=>"<span>"+d+"</span>").join("")+"</div>"
  +"<div class='cal-days'>"+cells+"</div>"
  +"<button class='cal-tod' onclick='"+todFn+"()'>📌 Today</button></div>";
}

function buildSrch(pid,sel){
  const s=srch[pid]||{open:false,query:""};
  const q=s.query.toLowerCase();
  const tops=getTopProducts();
  const topCat=tops.length>0?[{label:"⭐ Most Sold",hCls:"srch-cat cat-top",iCls:"srch-item",products:tops}]:[];
  const filtered=q?CATS.map(cat=>({...cat,products:cat.products.filter(p=>p.toLowerCase().includes(q))})).filter(cat=>cat.products.length>0):[...topCat,...CATS];
  if(!s.open)return "<div class='srch-wrap' id='srch-"+pid+"'><button class='srch-sel' id='srchsel-"+pid+"' onclick='srchOpen(\""+pid+"\")'><span class='"+(sel?"":"srch-ph")+"'>"+(sel?esc(sel):"-- Select Product --")+"</span><span style='color:#64748b;font-size:11px;'>&#9660;</span></button></div>";

  +(filtered.length>0?"<div class='srch-list'>"+filtered.map(cat=>"<div class='"+cat.hCls+"'>"+cat.label+"</div>"+cat.products.map(p=>"<div class='"+cat.iCls+"' onclick='srchPick(\""+pid+"\",\""+esc(p)+"\")'>"+esc(p)+"</div>").join("")).join("")+"</div>":"<div class='srch-list'><div style='padding:12px;font-size:13px;color:#64748b;'>No products found</div></div>")

  const rComm=rC.reduce((a,r)=>a+r.comm,0),rCred=rC.reduce((a,r)=>a+r.cred,0);
  const hasR=rC.some(r=>r.name&&r.rp>0);
  let html="<div class='pol-block'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;'><span style='font-size:13px;font-weight:700;color:#60a5fa;'>📋 Policy "+(i+1)+"</span>"+(pols.length>1?"<button class='btn-del' onclick='remPol(\""+b.id+"\")'>✕ Remove</button>":"")+"</div>"

function grandTot(){
  let comm=0,cred=0;
  for(const b of pols){const def=PROD[b.product];if(!def)continue;const t=def.terms.find(t=>t.l===b.term);if(!t)continue;const ap=parseFloat(b.ap)||0;comm+=ap*t.y/100;cred+=ap*t.c;for(const r of b.riders){const rd=getRiderRate(r.name,r.riderTerm);const rp=parseFloat(r.premium)||0;if(rd&&rp){comm+=rp*rd.y/100;cred+=rp*rd.c;}}}
  return{comm,cred};
}

// Income payout = sale month + 1 (same logic as FWD)
function getIncomePayoutMoYear(saleDate){
  const d=new Date(saleDate+"T00:00:00");
  d.setDate(1); d.setMonth(d.getMonth()+1);
  return{mo:d.getMonth(),yr:d.getFullYear()};
}

function getQD(ys,q,renewalYs=[],giYs=[]){
  const qs=ys.filter(s=>s.quarter===q);
  const rqs=renewalYs.filter(s=>s.quarter===q);
  const gqs=giYs.filter(s=>s.quarter===q);
  const tm=qs.reduce((a,s)=>a+s.totalComm,0)+rqs.reduce((a,s)=>a+s.totalComm,0)+gqs.reduce((a,s)=>a+s.totalComm,0);
  const bc=qs.reduce((a,s)=>a+s.baseComm,0);
  const tc=qs.reduce((a,s)=>a+s.totalCredit,0);
  const tier=getTier(tc);
  const eb=tm>=3000?tm*0.25:0;
  const qb=tm*tier.bonus/100;
  return{tm,bc,tc,tier,eb,qb,tb:eb+qb};
}

function getRenewalRate(rates,renewalYear){
  if(!rates||!rates.length)return 0;
  const idx=renewalYear-1;
  return(idx>=0&&idx<rates.length)?(rates[idx]||0):0;
}

              +"</div>"

        }).join("");

        html+="<div style='background:"+(si%2===0?"#0f172a":"#111827")+";padding:10px 14px;"+(isLast?"":"border-bottom:1px solid #1e293b;")+";'>"
        +"<div style='display:flex;align-items:center;gap:8px;margin-bottom:"+(s.policies.length>0?"7":"0")+"px;'>"

        +"<span style='font-size:11px;color:#475569;margin-left:6px;'>· "+s.policies.length+" polic"+(s.policies.length!==1?"ies":"y")+"</span>"
        +"</div>"

        +"<div style='font-size:14px;font-weight:800;color:#34d399;'>"+$f(s.totalComm)+"</div>"
        +"</div>"
        +"<button class='btn-del' onclick='doDelSale(\""+s.fid+"\")'>✕</button>"
        +"</div>"
        +polRows
        +"</div>";
      });
      html+="</div>";
    }
    html+="</div>";
  });

  return html;
}

function playCelebrationSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const t=ctx.currentTime;
    // Ascending run: C5 → E5 → G5 → C6
    [{freq:523.25,start:0,dur:0.12},{freq:659.25,start:0.13,dur:0.12},{freq:784.00,start:0.26,dur:0.12},{freq:1046.5,start:0.39,dur:0.55}].forEach(n=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='triangle';o.frequency.setValueAtTime(n.freq,t+n.start);
      g.gain.setValueAtTime(0,t+n.start);g.gain.linearRampToValueAtTime(0.35,t+n.start+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+n.start+n.dur);
      o.connect(g);g.connect(ctx.destination);o.start(t+n.start);o.stop(t+n.start+n.dur+0.05);
    });
    // Held major chord after run: C5+E5+G5
    [[523.25,0.46],[659.25,0.46],[784.00,0.46]].forEach(([freq,start])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(freq,t+start);
      g.gain.setValueAtTime(0,t+start);g.gain.linearRampToValueAtTime(0.18,t+start+0.03);g.gain.exponentialRampToValueAtTime(0.001,t+start+0.95);
      o.connect(g);g.connect(ctx.destination);o.start(t+start);o.stop(t+start+1.05);
    });
  }catch(e){}
}

function launchConfetti(customSound){
  (customSound||playCelebrationSound)();
  const cv=document.getElementById("confetti");cv.style.display="block";cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext("2d"),cols=["#34d399","#60a5fa","#fbbf24","#a78bfa","#f87171","#38bdf8","#fb923c"];
  const pieces=Array.from({length:180},()=>({x:Math.random()*cv.width,y:-10-Math.random()*200,w:8+Math.random()*8,h:5+Math.random()*5,color:cols[Math.floor(Math.random()*cols.length)],angle:Math.random()*360,spin:(-1+Math.random()*2)*4,vx:(-1+Math.random()*2)*3,vy:3+Math.random()*5,op:1}));
  let fr=0;
  function draw(){ctx.clearRect(0,0,cv.width,cv.height);pieces.forEach(p=>{ctx.save();ctx.globalAlpha=p.op;ctx.translate(p.x,p.y);ctx.rotate(p.angle*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();p.x+=p.vx;p.y+=p.vy;p.angle+=p.spin;p.vy+=0.07;if(fr>80)p.op-=0.018;});fr++;if(fr<140)requestAnimationFrame(draw);else{ctx.clearRect(0,0,cv.width,cv.height);cv.style.display="none";}}
  draw();
}

function animateJackpot(el,to,from=0){
  if(!el||to===from){if(el)el.textContent=$f(to);return;}
  // Explicit delay schedule: fast at first, decelerates like a slot machine
  const delays=[28,28,32,32,38,50,70,95,125,160,195,230];
  let i=0;
  const fmt=v=>"$"+Math.round(v).toLocaleString("en-SG"); // fast integer fmt for spin
  function step(){
    const t=i/delays.length;
    el.textContent=t<0.55
      ?fmt(from+Math.random()*(to-from)*1.12)
      :fmt(from+(to-from)*(1-Math.pow(1-(t-0.55)/0.45,2)));
    i++;
    if(i<delays.length)setTimeout(step,delays[i]);
    else el.textContent=$f(to); // final: use full formatter with decimals
  }
  step();
}

function pipEstimate(product,term,premium){
  const ap=parseFloat(premium)||0;
  const def=PROD[product];
  const t=def&&def.terms&&(def.terms.find(x=>x.l===term)||def.terms[0]);
  if(!t||!ap)return{comm:0,credit:0,rate:0};
  return{comm:ap*t.y/100,credit:ap*t.c,rate:t.y};
}

function renderPipeline(){
  const now=Date.now();
  const cases=pipelineCases.filter(c=>pipFilter==="all"||c.stage===pipFilter);
  const allCases=pipelineCases;

  // Totals
  const totalPipeVal=allCases.reduce((a,c)=>a+(parseFloat(c.estPremium)||0),0);
  const totalPipeComm=allCases.reduce((a,c)=>a+pipEstimate(c.product,c.term,c.estPremium).comm,0);

  // MDRT projection
  const MDRT_T=75800,COT_T=MDRT_T*3;
  const{grand:incomeGrand}=getYearTotals(selYear);
  const fwdYrTotal=fwdSales.map(s=>({...s,...liveFWDComm(s)})).filter(s=>s.date.startsWith(String(selYear))).reduce((a,s)=>a+s.commission,0);
  const currentGrand=incomeGrand+fwdYrTotal;
  const projGrand=currentGrand+totalPipeComm;

  // Trailblazer projection
  const trailComm=sales.filter(s=>s.date.startsWith("2026")).reduce((a,s)=>a+s.totalComm,0);
  const trailPipe=allCases.reduce((a,c)=>a+pipEstimate(c.product,c.term,c.estPremium).comm,0);
  const TRAIL_T1=75000,TRAIL_T2=150000;

  // Quarter credits
  const yrSalesQ=sales.filter(s=>s.date.startsWith(String(selYear)));
  const qSalesNow=yrSalesQ.filter(s=>s.quarter===activeQ);
  const qCredNow=qSalesNow.reduce((a,s)=>a+s.totalCredit,0);
  const qCommNow=qSalesNow.reduce((a,s)=>a+s.totalComm,0);
  const tierNow=getTier(qCredNow);

  let html="<style>.pip-filter-btn{padding:7px 14px;border-radius:20px;border:1px solid #334155;background:transparent;color:#64748b;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}.pip-filter-btn.active{color:#fff;border-color:transparent;}</style>";

  // ── Goal progress bars ──
  html+="<div style='background:linear-gradient(135deg,#0f172a,#1a2035);border-radius:14px;padding:16px;border:1px solid #1e293b;margin-bottom:14px;'>"
  +"<div style='font-size:13px;font-weight:700;color:#94a3b8;margin-bottom:12px;'>🎯 Goal Progress <span style='font-size:11px;font-weight:400;color:#475569;'>· lighter bar = pipeline projection</span></div>"
  // MDRT bar
  +"<div style='margin-bottom:12px;'>"
  +"<div style='display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:4px;'><span>🥇 MDRT <span style='color:#f59e0b;font-weight:700;'>"+$f(currentGrand)+"</span> → <span style='color:#34d399;'>"+$f(projGrand)+"</span> / "+$f(MDRT_T)+"</span><span style='color:#f59e0b;'>"+Math.min(100,(currentGrand/MDRT_T*100)).toFixed(1)+"%</span></div>"
  +"<div style='background:rgba(0,0,0,0.35);border-radius:6px;height:10px;overflow:hidden;position:relative;'>"
  +"<div style='position:absolute;left:0;top:0;height:100%;background:rgba(245,158,11,0.25);border-radius:6px;width:"+Math.min(100,(projGrand/MDRT_T*100))+"%;'></div>"
  +"<div style='position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#d97706,#f59e0b);border-radius:6px;width:"+Math.min(100,(currentGrand/MDRT_T*100))+"%;'></div>"
  +"</div></div>"
  // Trailblazer bar
  +"<div>"
  +"<div style='display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:4px;'><span>🌍 Trailblazer <span style='color:#10b981;font-weight:700;'>"+$f(trailComm)+"</span> → <span style='color:#34d399;'>"+$f(trailComm+trailPipe)+"</span> / "+$f(TRAIL_T1)+"</span><span style='color:#10b981;'>"+Math.min(100,(trailComm/TRAIL_T1*100)).toFixed(1)+"%</span></div>"
  +"<div style='background:rgba(0,0,0,0.35);border-radius:6px;height:10px;overflow:hidden;position:relative;'>"
  +"<div style='position:absolute;left:0;top:0;height:100%;background:rgba(16,185,129,0.2);border-radius:6px;width:"+Math.min(100,((trailComm+trailPipe)/TRAIL_T1*100))+"%;'></div>"
  +"<div style='position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#059669,#10b981);border-radius:6px;width:"+Math.min(100,(trailComm/TRAIL_T1*100))+"%;'></div>"
  +"</div></div>"
  +"</div>";

  // ── Summary cards ──
  html+="<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;'>"
  +"<div style='background:#1e293b;border-radius:12px;padding:12px;border:1px solid #334155;text-align:center;'>"
  +"<div style='font-size:10px;color:#64748b;text-transform:uppercase;'>Pipeline Cases</div>"
  +"<div style='font-size:26px;font-weight:900;color:#e2e8f0;margin-top:4px;'>"+allCases.length+"</div>"
  +"</div>"
  +"<div style='background:#1e293b;border-radius:12px;padding:12px;border:1px solid #334155;text-align:center;'>"
  +"<div style='font-size:10px;color:#64748b;text-transform:uppercase;'>Total Pipeline</div>"
  +"<div style='font-size:20px;font-weight:900;color:#60a5fa;margin-top:4px;'>"+$f(totalPipeVal)+"</div>"
  +"<div style='font-size:10px;color:#475569;margin-top:2px;'>AP</div>"
  +"</div>"
  +"<div style='background:#1e293b;border-radius:12px;padding:12px;border:1px solid #334155;text-align:center;'>"
  +"<div style='font-size:10px;color:#64748b;text-transform:uppercase;'>Est. Commission</div>"
  +"<div style='font-size:20px;font-weight:900;color:#34d399;margin-top:4px;'>"+$f(totalPipeComm)+"</div>"
  +"<div style='font-size:10px;color:#475569;margin-top:2px;'>if all close</div>"
  +"</div></div>";

  // ── Add new case button ──
  if(!pipFormOpen){
    html+="<button onclick='openPipForm()' style='width:100%;padding:12px;border-radius:12px;border:2px dashed #334155;background:rgba(30,41,59,0.5);color:#60a5fa;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px;transition:all 0.2s;'>＋ Add New Pipeline Case</button>";
  } else {
    html+=buildPipForm();
  }

  // ── Stage filter pills ──
  html+="<div style='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;'>";
  html+="<button class='pip-filter-btn"+(pipFilter==="all"?" active":"")+"' style='"+(pipFilter==="all"?"background:#1e40af;border-color:#3b82f6;color:#fff;":"")+"' onclick='setPipFilter(\"all\")'>All ("+allCases.length+")</button>";
  Object.entries(PIPE_STAGES).forEach(([k,s])=>{
    const cnt=allCases.filter(c=>c.stage===k).length;
    if(cnt===0)return;
    html+="<button class='pip-filter-btn"+(pipFilter===k?" active":"")+"' style='"+(pipFilter===k?"background:"+s.bg+";border-color:"+s.color+";color:"+s.color+";":"")+"' onclick='setPipFilter(\""+k+"\")'>"+s.label+" ("+cnt+")</button>";
  });
  html+="</div>";

  // ── Quarter breakdown ──
  const qLabels=["Q1","Q2","Q3","Q4"];
  const qColors=["#f59e0b","#10b981","#60a5fa","#a78bfa"];
  const qData=qLabels.map(q=>{
    const qCases=allCases.filter(c=>c.targetQ===q);
    return{q,count:qCases.length,ap:qCases.reduce((a,c)=>a+(parseFloat(c.estPremium)||0),0),comm:qCases.reduce((a,c)=>a+pipEstimate(c.product,c.term,c.estPremium).comm,0)};
  });
  const unassigned=allCases.filter(c=>!c.targetQ);
  if(allCases.length>0){
    html+="<div style='background:rgba(15,23,42,0.6);border-radius:12px;padding:12px;border:1px solid #1e293b;margin-bottom:14px;'>"
    +"<div style='font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;'>📅 Pipeline by Quarter</div>"
    +"<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:8px;'>"
    +qData.map((d,i)=>{
      const col=qColors[i];
      const hasData=d.count>0;
      return "<div style='background:"+(hasData?"rgba(15,23,42,0.9)":"rgba(15,23,42,0.3)")+";border-radius:10px;padding:10px;border:1px solid "+(hasData?col+"44":"#1e293b")+";text-align:center;'>"
      +"<div style='font-size:12px;font-weight:700;color:"+(hasData?col:"#334155")+";'>"+d.q+"</div>"
      +(hasData
        ?"<div style='font-size:11px;color:#e2e8f0;font-weight:700;margin-top:4px;'>"+d.count+" case"+(d.count>1?"s":"")+"</div>"
        +"<div style='font-size:10px;color:#64748b;margin-top:2px;'>"+$f(d.ap)+" AP</div>"
        +"<div style='font-size:10px;color:#34d399;font-weight:600;'>"+$f(d.comm)+"</div>"
        :"<div style='font-size:11px;color:#334155;margin-top:4px;'>—</div>"
      )
      +"</div>";
    }).join("")
    +"</div>"
    +(unassigned.length?"<div style='font-size:11px;color:#475569;margin-top:8px;text-align:center;'>"+unassigned.length+" case"+(unassigned.length>1?"s":"")+" not assigned to a quarter</div>":"")
    +"</div>";
  }

  // ── Pipeline cards ──
  if(cases.length===0){
    html+="<div style='text-align:center;color:#475569;padding:40px;background:rgba(15,23,42,0.5);border-radius:12px;border:1px dashed #334155;font-size:13px;'>No pipeline cases"+(pipFilter!=="all"?" for this stage":"")+" yet.<br><span style='font-size:12px;'>Add one above to start tracking.</span></div>";
  } else {
    cases.forEach((c,idx)=>{
      const s=PIPE_STAGES[c.stage]||PIPE_STAGES.warm;
      const est=pipEstimate(c.product,c.term,c.estPremium);
      const ap=parseFloat(c.estPremium)||0;
      const projCred=qCredNow+est.credit;
      const nextTierPip=est.credit>0?TIERS.find(t=>t.min>projCred):null;
      const curTierPip=est.credit>0?getTier(projCred):null;
      const lastFU=c.followUps&&c.followUps.length?(c.followUps[c.followUps.length-1]):null;
      const fuDaysAgo=lastFU?Math.floor((now-new Date(lastFU.date).getTime())/(86400000)):null;
      const meetDaysAgo=c.lastMeeting?Math.floor((now-new Date(c.lastMeeting+"T00:00:00").getTime())/(86400000)):null;
      const isClosing=closingPid===c.fid;
      const isFollowing=followPid===c.fid;

      // Closing close panel preview
      let closePanelHtml="";
      if(isClosing){
        const clPrem=pipCloseForm.premium!=""?pipCloseForm.premium:c.estPremium;
        const clProd=pipCloseForm.product||c.product;
        const clTerm=pipCloseForm.term||c.term;
        const clEst=pipEstimate(clProd,clTerm,clPrem);
        const clAP=parseFloat(clPrem)||0;
        const def=PROD[clProd];
        const clTier=getTier(qCredNow+clEst.credit);
        const nextT=TIERS.find(t=>t.min>qCredNow+clEst.credit);
        closePanelHtml="<div style='margin-top:12px;background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;border:1px solid rgba(52,211,153,0.3);'>"
        +"<div style='font-size:12px;font-weight:700;color:#34d399;margin-bottom:10px;'>✅ Confirm Close — Adjust if needed</div>"
        +"<label style='font-size:11px;color:#94a3b8;'>Annual Premium (SGD)</label>"
        +"<input class='inp' type='number' value='"+clPrem+"' oninput='setPipClosePrem(this.value)' style='width:100%;margin:4px 0 8px;'/>"
        +(def?"<label style='font-size:11px;color:#94a3b8;'>Term</label>"
        +"<select class='inp' onchange='setPipCloseTerm(this.value)' style='width:100%;margin:4px 0 8px;'>"
        +def.terms.map(t=>"<option value='"+t.l+"'"+(t.l===clTerm?" selected":"")+">"+t.l+" (Y1: "+t.y+"%)</option>").join("")
        +"</select>":"")
        +"<div style='display:flex;gap:10px;margin-bottom:10px;'>"
        +"<div style='flex:1;background:rgba(15,23,42,0.8);border-radius:8px;padding:10px;text-align:center;'><div style='font-size:10px;color:#64748b;'>Est Commission</div><div style='font-size:18px;font-weight:800;color:#34d399;'>"+$f(clEst.comm)+"</div></div>"
        +"<div style='flex:1;background:rgba(15,23,42,0.8);border-radius:8px;padding:10px;text-align:center;'><div style='font-size:10px;color:#64748b;'>Credits Added</div><div style='font-size:18px;font-weight:800;color:#60a5fa;'>"+$c(clEst.credit)+"</div></div>"
        +"<div style='flex:1;background:rgba(15,23,42,0.8);border-radius:8px;padding:10px;text-align:center;'><div style='font-size:10px;color:#64748b;'>Qtr Bonus Tier</div><div style='font-size:18px;font-weight:800;color:#a78bfa;'>"+clTier.bonus+"%</div></div>"
        +"</div>"
        +(nextT&&clEst.credit>0?"<div style='font-size:11px;color:#f59e0b;margin-bottom:8px;'>⚡ "+$c(nextT.min-(qCredNow+clEst.credit))+" more credits to reach "+nextT.bonus+"% tier</div>":"")
        +"<div style='display:flex;gap:8px;'>"
        +"<button class='btn-sm' style='flex:1;padding:11px;font-size:13px;font-weight:700;background:rgba(15,80,72,0.9);border-color:rgba(52,211,153,0.7);' onclick='confirmClosePipeline(\""+c.fid+"\")'>🏆 Close Case & Log Sale!</button>"
        +"<button class='btn-sm' style='padding:11px 14px;background:rgba(51,65,85,0.4);border-color:#334155;color:#94a3b8;' onclick='cancelClosePipeline()'>✕</button>"
        +"</div></div>";
      }

      // Follow-up panel
      let fuPanelHtml="";
      if(isFollowing){
        fuPanelHtml="<div style='margin-top:10px;background:rgba(0,0,0,0.25);border-radius:10px;padding:12px;border:1px solid rgba(96,165,250,0.3);'>"
        +"<div style='font-size:11px;color:#94a3b8;margin-bottom:6px;font-weight:700;'>📞 Log Follow-up Note</div>"
        +"<input class='inp' type='text' placeholder='e.g. Called, will think about it...' value='"+esc(pipFollowNote)+"' oninput='setPipFollowNote(this.value)' style='width:100%;margin-bottom:8px;color:#ffffff;'/>"
        +"<div style='display:flex;gap:8px;'>"
        +"<button class='btn-sm' style='flex:1;padding:8px;font-size:12px;background:rgba(30,58,138,0.7);border-color:#3b82f6;' onclick='confirmFollowUp(\""+c.fid+"\")'>✅ Save</button>"
        +"<button class='btn-sm' style='padding:8px 12px;background:rgba(51,65,85,0.4);border-color:#334155;color:#94a3b8;' onclick='cancelFollowUp()'>✕</button>"
        +"</div></div>";
      }

      // Follow-up history
      let fuHistHtml="";
      if(c.followUps&&c.followUps.length){
        fuHistHtml="<div style='margin-top:8px;'>";
        const recent=[...c.followUps].reverse().slice(0,5);
        recent.forEach((fu,fi)=>{
          const d=new Date(fu.date);
          fuHistHtml+="<div style='font-size:11px;color:#94a3b8;padding:4px 0;border-bottom:1px solid #1e293b;display:flex;gap:8px;align-items:flex-start;'>"
          +"<span style='color:#475569;white-space:nowrap;min-width:80px;'>"+d.toLocaleDateString("en-SG",{day:"2-digit",month:"short"})+"</span>"
          +"<span style='color:#ffffff;flex:1;'>"+esc(fu.note||"Follow-up logged")+"</span>"
          +"</div>";
        });
        fuHistHtml+="</div>";
      }

      html+="<div class='pipe-card "+s.cls+"' style='border-radius:14px;padding:16px;border:1px solid;margin-bottom:12px;animation-delay:"+idx*0.06+"s;'>"
      // Header row
      +"<div style='display:flex;justify-content:space-between;align-items:flex-start;'>"
      +"<div style='flex:1;min-width:0;'>"
      +"<div style='display:flex;align-items:center;gap:8px;flex-wrap:wrap;'>"
      +"<div style='font-size:15px;font-weight:800;color:#f1f5f9;'>"+esc(c.clientName)+"</div>"
      +"<span style='font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:"+s.bg+";color:"+s.color+";border:1px solid "+s.color+"55;'>"+s.label+"</span>"
      +"<select onchange='setPipelineStage(\""+c.fid+"\",this.value)' style='font-size:10px;background:#1e293b;color:#64748b;border:1px solid #334155;border-radius:6px;padding:1px 4px;cursor:pointer;'>"
      +Object.entries(PIPE_STAGES).map(([k,st])=>"<option value='"+k+"'"+(c.stage===k?" selected":"")+">"+st.label+"</option>").join("")
      +"</select>"
      +"<select onchange='setPipelineTargetQ(\""+c.fid+"\",this.value)' style='font-size:10px;background:#1e293b;color:"+(c.targetQ?"#60a5fa":"#64748b")+";border:1px solid "+(c.targetQ?"#1e40af":"#334155")+";border-radius:6px;padding:1px 4px;cursor:pointer;font-weight:"+(c.targetQ?"700":"400")+";'>"
      +"<option value=''>— Q? —</option>"
      +["Q1","Q2","Q3","Q4"].map(q=>"<option value='"+q+"'"+(c.targetQ===q?" selected":"")+">"+q+" "+selYear+"</option>").join("")
      +"</select>"
      +"</div>"
      +(c.product?"<div style='font-size:12px;color:#94a3b8;margin-top:3px;'>"+esc(c.product)+(c.term?" · "+esc(c.term):"")+"</div>":"")
      +(c.notes?"<div style='font-size:11px;color:#64748b;margin-top:3px;font-style:italic;'>📝 "+esc(c.notes)+"</div>":"")
      +"</div>"
      // Commission estimate
      +"<div style='text-align:right;padding-left:12px;flex-shrink:0;'>"
      +"<div style='font-size:11px;color:#64748b;'>Est AP</div>"
      +"<div style='font-size:14px;font-weight:700;color:#60a5fa;'>"+$f(ap)+"</div>"
      +(est.comm>0?"<div style='font-size:11px;color:#64748b;margin-top:2px;'>Est Comm</div><div style='font-size:18px;font-weight:900;color:#34d399;'>"+$f(est.comm)+"</div>":"")
      +(nextTierPip?"<div style='font-size:10px;color:#f59e0b;margin-top:6px;line-height:1.4;'>⚡ "+$c(nextTierPip.min-projCred)+"<br>to "+nextTierPip.bonus+"% tier</div>":curTierPip?"<div style='font-size:10px;color:#34d399;margin-top:6px;'>✓ "+curTierPip.bonus+"% tier</div>":"")
      +"</div></div>"
      // Info row
      +"<div style='display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;'>"
      +(c.lastMeeting?"<span style='font-size:11px;color:#64748b;'>🗓 Last meeting: <span style='color:#94a3b8;font-weight:600;'>"+new Date(c.lastMeeting+"T00:00:00").toLocaleDateString("en-SG",{day:"2-digit",month:"short",year:"numeric"})+(meetDaysAgo!==null?" ("+meetDaysAgo+"d ago)":"")+"</span></span>":"")
      +"<span style='font-size:11px;color:#64748b;'>📞 Follow-ups: <span style='color:#94a3b8;font-weight:600;'>"+(c.followUps&&c.followUps.length?c.followUps.length+" times"+(fuDaysAgo!==null?", last "+fuDaysAgo+"d ago":""):"None yet")+"</span></span>"
      +"</div>"
      +fuHistHtml
      // Action buttons
      +"<div style='display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;'>"
      +"<button class='btn-sm' style='flex:1;padding:9px;font-size:12px;background:rgba(30,58,138,0.6);border-color:#3b82f6;' onclick='startFollowUp(\""+c.fid+"\")'>📞 Log Follow-up</button>"
      +"<button class='btn-sm' style='flex:1;padding:9px;font-size:12px;font-weight:700;background:linear-gradient(135deg,rgba(15,80,40,0.9),rgba(6,40,20,0.95));border-color:rgba(52,211,153,0.7);color:#34d399;' onclick='startClosePipeline(\""+c.fid+"\")'>🏆 Close Case!</button>"
      +"<button class='btn-sm' style='padding:9px 12px;background:rgba(127,29,29,0.3);border-color:rgba(239,68,68,0.3);color:#f87171;font-size:12px;' onclick='deletePipeline(\""+c.fid+"\")'>✕</button>"
      +"</div>"
      +fuPanelHtml
      +closePanelHtml
      +"</div>";
    });
  }

  return html;
}

function buildPipForm(){
  const def=PROD[pipForm.product];
  const estAP=parseFloat(pipForm.estPremium)||0;
  const est=pipEstimate(pipForm.product,pipForm.term,pipForm.estPremium);
  if(!srch["pip"])srch["pip"]={open:false,query:""};

  let html="<div style='background:linear-gradient(135deg,#0f172a,#1a2035);border-radius:14px;padding:16px;border:1px solid #1e40af;margin-bottom:14px;'>"
  +"<div style='font-size:14px;font-weight:700;color:#60a5fa;margin-bottom:12px;'>＋ New Pipeline Case</div>"
  // Client name
  +"<label style='font-size:11px;color:#94a3b8;'>Client Name</label>"
  +"<input class='inp' type='text' placeholder='Client name...' value='"+esc(pipForm.client)+"' oninput='setPipFormStr(\"client\",this.value)' style='width:100%;margin:4px 0 10px;color:#ffffff;'/>"
  // Product search — uses same buildSrch component as Log Sale
  +"<label style='font-size:11px;color:#94a3b8;'>Product <span style='color:#475569;'>(optional — for commission estimate)</span></label>"
  +"<div style='margin:4px 0 10px;'>"+buildSrch("pip",pipForm.product)+"</div>"
  // Term (if product selected)
  +(def&&def.terms&&def.terms.length>1?"<label style='font-size:11px;color:#94a3b8;'>Term <span style='color:#475569;'>(optional)</span></label>"
  +"<select class='inp' onchange='setPipTerm(this.value)' style='width:100%;margin:4px 0 10px;'>"
  +"<option value=''>— Select term —</option>"
  +def.terms.map(t=>"<option value='"+t.l+"'"+(pipForm.term===t.l?" selected":"")+">"+t.l+" (Y1: "+t.y+"%)</option>").join("")
  +"</select>":"")
  // Est premium
  +"<label style='font-size:11px;color:#94a3b8;'>Estimated Annual Premium (SGD)</label>"
  +"<input class='inp' type='number' placeholder='e.g. 5000' value='"+pipForm.estPremium+"' oninput='setPipPrem(this.value)' style='width:100%;margin:4px 0 10px;'/>"
  // Est commission preview — stable id so setPipPrem swaps only this, no full re-render
  +"<div id='pip-comm-preview'>"
  +(est.comm>0?"<div style='background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);border-radius:8px;padding:10px;margin-bottom:10px;display:flex;gap:16px;'>"
  +"<span style='font-size:12px;color:#64748b;'>Est Comm: <strong style='color:#34d399;'>"+$f(est.comm)+"</strong></span>"
  +"<span style='font-size:12px;color:#64748b;'>Est Credits: <strong style='color:#60a5fa;'>"+$c(est.credit)+"</strong></span>"
  +"</div>":"")
  +"</div>"
  // Stage + Target Quarter row
  +"<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;'>"
  +"<div><label style='font-size:11px;color:#94a3b8;'>Stage</label>"
  +"<div style='display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;'>"
  +Object.entries(PIPE_STAGES).map(([k,s])=>"<button onclick='setPipStage(\""+k+"\")' style='padding:4px 10px;border-radius:14px;border:1px solid "+(pipForm.stage===k?s.color:"#334155")+";background:"+(pipForm.stage===k?s.bg:"transparent")+";color:"+(pipForm.stage===k?s.color:"#64748b")+";font-size:11px;font-weight:600;cursor:pointer;'>"+s.label+"</button>").join("")
  +"</div></div>"
  +"<div><label style='font-size:11px;color:#94a3b8;'>Target Quarter <span style='color:#475569;'>(optional)</span></label>"
  +"<select class='inp' onchange='setPipTargetQ(this.value)' style='width:100%;margin-top:4px;'>"
  +"<option value=''"+(!pipForm.targetQ?" selected":"")+">— Any —</option>"
  +["Q1","Q2","Q3","Q4"].map(q=>"<option value='"+q+"'"+(pipForm.targetQ===q?" selected":"")+">"+q+" "+selYear+"</option>").join("")
  +"</select></div>"
  +"</div>"
  // Last meeting
  +"<label style='font-size:11px;color:#94a3b8;'>Last Meeting Date <span style='color:#475569;'>(optional)</span></label>"
  +"<div style='margin:4px 0 10px;'>"+buildPipCal()+"</div>"
  // Notes
  +"<label style='font-size:11px;color:#94a3b8;'>Notes <span style='color:#475569;'>(optional)</span></label>"
  +"<input class='inp' type='text' placeholder='e.g. Interested in term plan, budget ~$200/m' value='"+esc(pipForm.notes)+"' oninput='setPipFormStr(\"notes\",this.value)' style='width:100%;margin:4px 0 12px;color:#ffffff;'/>"
  // Buttons
  +"<div style='display:flex;gap:8px;'>"
  +"<button class='btn-sm' style='flex:1;padding:11px;font-size:13px;font-weight:700;' onclick='doAddPipeline()'>＋ Add to Pipeline</button>"
  +"<button class='btn-sm' style='padding:11px 14px;background:rgba(51,65,85,0.4);border-color:#334155;color:#94a3b8;' onclick='closePipForm()'>Cancel</button>"
  +"</div></div>";
  return html;
}

window.doAddPipeline=async()=>{
  if(!pipForm.client.trim()){alert("Please enter a client name.");return;}
  const obj={clientName:pipForm.client.trim(),product:pipForm.product,term:pipForm.term,estPremium:pipForm.estPremium,stage:pipForm.stage,lastMeeting:pipForm.lastMeeting,notes:pipForm.notes,targetQ:pipForm.targetQ,followUps:[],createdAt:new Date().toISOString()};
  await addPipelineDB(obj);
  pipFormOpen=false;pipForm={client:"",product:"",term:"",estPremium:"",stage:"hot",lastMeeting:"",notes:"",targetQ:""};srch["pip"]={open:false,query:""};
};

window.confirmFollowUp=async(fid)=>{
  const c=pipelineCases.find(x=>x.fid===fid);if(!c)return;
  const note=pipFollowNote.trim();
  const fu=[...(c.followUps||[]),{date:new Date().toISOString(),note}];
  await updatePipelineDB(fid,{followUps:fu});
  followPid=null;pipFollowNote="";
};

window.confirmClosePipeline=async(fid)=>{
  const c=pipelineCases.find(x=>x.fid===fid);if(!c)return;
  const clPrem=pipCloseForm.premium!=""?pipCloseForm.premium:c.estPremium;
  const clProd=pipCloseForm.product||c.product;
  const clTerm=pipCloseForm.term||c.term;
  const ap=parseFloat(clPrem)||0;
  if(ap<=0){alert("Please enter a valid premium.");return;}
  const def=PROD[clProd];
  const t=def&&def.terms&&(def.terms.find(x=>x.l===clTerm)||def.terms[0]);
  const baseComm=t?ap*t.y/100:0;
  const baseCred=t?ap*t.c:0;
  const pol={product:clProd,term:clTerm||"",annualPremium:ap,commPct:t?t.y:0,baseComm,baseCred,riders:[],totalComm:baseComm,totalCredit:baseCred};
  const mo=new Date().getMonth();
  const obj={date:todayStr(),clientName:c.clientName,policies:[pol],totalComm:baseComm,baseComm,totalCredit:baseCred,quarter:getQ(mo),month:mo};
  const prevIncome=getYearTotals(selYear).incomeComm;
  await addSaleDB(obj);
  await delPipelineDB(fid);
  closingPid=null;pipCloseForm={premium:"",product:"",term:""};
  launchCommFloat(baseComm);
  launchConfetti();
  setTimeout(()=>{
    const cv=document.getElementById("confetti");
    if(cv){cv.style.display="none";}
    tab="dashboard";
    renderAll();
    window.scrollTo(0,0);
    setTimeout(()=>animateJackpot(document.getElementById("dash-income-val"),prevIncome+baseComm,prevIncome),60);
  },1600);
};

onAuthStateChanged(auth,user=>{
  if(user){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("appShell").style.display="";
    startListeners();
  } else {
    document.getElementById("loginScreen").style.display="";
    document.getElementById("appShell").style.display="none";
    if(unsubSales){unsubSales();unsubSales=null;}
    if(unsubFWD){unsubFWD();unsubFWD=null;}
    if(unsubGI){unsubGI();unsubGI=null;}
    if(unsubRenewal){unsubRenewal();unsubRenewal=null;}
    sales=[];fwdSales=[];giSales=[];renewalSales=[];
  }
});

window.doSignIn=async()=>{
  try{await signInWithPopup(auth,gProvider);}
  catch(e){if(e.code!=="auth/cancelled-by-user"&&e.code!=="auth/popup-closed-by-user")alert("Sign-in failed. Please try again.");}
};
window.doSignOut=async()=>{if(confirm("Sign out of this device?"))await signOut(auth);};
</script>
